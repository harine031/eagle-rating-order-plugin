<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexible Sort Board</title>
  <script src="js/plugin.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #202124;
      color: #f1f3f4;
      font-family: system-ui, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: -16px -16px 12px;
      padding: 16px;
      background: #202124;
    }
    button { padding: 7px 12px; cursor: pointer; }
    .iconButton { width: 34px; padding: 7px 0; font-size: 18px; line-height: 1; }
    .ratingButtons { display: inline-flex; gap: 2px; }
    .ratingButton { min-width: 28px; padding: 5px 7px; }
    .ratingButton.active { color: #202124; background: #ffd54f; border-color: #ffd54f; }
    .filterGroup { display: inline-flex; gap: 4px; align-items: center; }
    .dangerButton { color: #fff; background: #8b2c2c; border-color: #b94a48; }
    select, input { padding: 7px; background: #303134; color: #f1f3f4; border: 1px solid #5f6368; }
    #status { margin-left: auto; color: #bdc1c6; font-size: 13px; }
    #list { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-size, 180px), 1fr)); gap: 12px; }
    .item { position: relative; padding: 8px; background: #303134; border: 1px solid transparent; border-radius: 6px; cursor: grab; }
    .item.selected { border-color: #8ab4f8; box-shadow: 0 0 0 2px rgba(138, 180, 248, .35); }
    .item.multi-selected { border-color: #81c995; box-shadow: 0 0 0 2px rgba(129, 201, 149, .35); }
    .item.dragging { opacity: .45; border-color: #8ab4f8; }
    #dropIndicator {
      content: "";
      position: absolute;
      width: 5px;
      background: #8ab4f8;
      border-radius: 4px;
      z-index: 2;
      box-shadow: 0 0 8px #8ab4f8;
      pointer-events: none;
    }
    .item img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; margin-bottom: 8px; background: #171717; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rating { color: #ffd54f; font-size: 13px; margin-top: 4px; }
    .empty { color: #bdc1c6; padding: 32px; text-align: center; }
    #previewOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: rgba(0, 0, 0, .86);
    }
    #previewOverlay[hidden] { display: none; }
    #previewImage { max-width: 95vw; max-height: 90vh; object-fit: contain; }
    .previewButton { position: fixed; top: 50%; z-index: 11; transform: translateY(-50%); width: 40px; height: 64px; font-size: 26px; background: rgba(32, 33, 36, .28); color: rgba(255, 255, 255, .7); border: 1px solid rgba(255, 255, 255, .25); opacity: .42; transition: opacity .15s, background .15s; }
    .previewButton:hover { opacity: 1; background: rgba(32, 33, 36, .85); color: #fff; }
    #previewPrevious { left: 16px; }
    #previewNext { right: 16px; }
    #previewCounter { position: fixed; top: 14px; left: 0; right: 0; text-align: center; color: #fff; }
    #previewToolbar { position: fixed; right: 18px; bottom: 42px; display: flex; gap: 4px; z-index: 11; padding: 4px; border-radius: 6px; background: rgba(32, 33, 36, .35); opacity: .34; transition: opacity .15s, background .15s; }
    #previewToolbar:hover { opacity: 1; background: rgba(32, 33, 36, .9); }
    #previewToolbar button { min-width: 34px; padding: 5px 8px; color: #fff; }
    #previewImage { transition: transform .15s ease; }
    #previewName {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 12px;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 3px #000;
    }
  </style>
</head>
<body>
  <header>
    <button id="reload" class="iconButton" title="再読み込み" aria-label="再読み込み">↻</button>
    <span>評価</span>
    <span id="ratingButtons" class="ratingButtons" aria-label="評価変更">
      <button class="ratingButton" data-rating="0" title="評価なし">0</button>
      <button class="ratingButton" data-rating="1" title="★1">1</button>
      <button class="ratingButton" data-rating="2" title="★2">2</button>
      <button class="ratingButton" data-rating="3" title="★3">3</button>
      <button class="ratingButton" data-rating="4" title="★4">4</button>
      <button class="ratingButton" data-rating="5" title="★5">5</button>
    </span>
    <label>並び替え
      <select id="sortSelect">
        <option value="manual">手動順</option>
        <option value="rating-desc" selected>評価：高い順</option>
        <option value="rating-asc">評価：低い順</option>
        <option value="name-asc">名前：A→Z</option>
        <option value="name-desc">名前：Z→A</option>
        <option value="imported-desc">取り込み日時：新しい順</option>
        <option value="imported-asc">取り込み日時：古い順</option>
        <option value="modified-desc">更新日時：新しい順</option>
        <option value="modified-asc">更新日時：古い順</option>
        <option value="size-desc">ファイルサイズ：大きい順</option>
        <option value="size-asc">ファイルサイズ：小さい順</option>
        <option value="resolution-desc">解像度：大きい順</option>
        <option value="resolution-asc">解像度：小さい順</option>
        <option value="ext-asc">拡張子：A→Z</option>
        <option value="random">ランダム</option>
      </select>
    </label>
    <label class="sizeControl" for="tileSize">画像サイズ <input id="tileSize" type="range" min="100" max="800" step="10" value="180"> <output id="tileSizeValue" for="tileSize">180px</output></label>
    <span class="filterGroup">
      <label for="ratingFilter">評価フィルター</label>
      <select id="ratingFilter">
        <option value="all">すべて</option>
        <option value="0">評価なし（0）</option>
        <option value="1">★1</option>
        <option value="2">★2</option>
        <option value="3">★3</option>
        <option value="4">★4</option>
        <option value="5">★5</option>
      </select>
    </span>
    <button id="trashUnrated" class="dangerButton">評価なしをゴミ箱へ</button>
    <button id="trashSelected" class="dangerButton" title="Deleteキーでも実行">選択をゴミ箱へ</button>
    <label>桁数 <input id="renameDigits" type="number" min="1" max="8" value="3"></label>
    <label>後半の名前 <input id="renameBaseName" placeholder="例：name" size="18"></label>
    <button id="renameSequential">現在の順番で連番リネーム</button>
    <button id="renameSelected">選択画像を連番リネーム</button>
    <input id="tagInput" placeholder="タグ名" size="10">
    <button id="addTag">タグ追加</button>
    <button id="removeTag">タグ削除</button>
    <span id="status">起動中…</span>
  </header>
  <div class="hint">例：「name」と入力すると、001_name、002_name、003_name…になります。</div>
  <main id="list"></main>

  <div id="previewOverlay" hidden>
    <button id="previewPrevious" class="previewButton" title="前の画像（←）">‹</button>
    <img id="previewImage" alt="">
    <button id="previewNext" class="previewButton" title="次の画像（→）">›</button>
    <div id="previewCounter"></div>
    <div id="previewToolbar">
      <button id="previewOpen" title="Eagle本体で開く">↗</button>
      <button id="previewZoomOut" title="縮小">−</button>
      <button id="previewZoomReset" title="拡大率リセット">100%</button>
      <button id="previewZoomIn" title="拡大">＋</button>
      <button id="previewRotate" title="右回転">↻</button>
      <button id="previewSlideshow" title="スライドショー">▶</button>
    </div>
    <div id="previewName"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
